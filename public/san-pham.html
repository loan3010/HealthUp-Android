<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealthUp — Sản phẩm</title>
  <meta name="description" content="Xem sản phẩm trên ứng dụng HealthUp" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1.25rem; color: #1a1a1a; text-align: center; }
    h1 { font-size: 1.35rem; color: #36873A; }
    a.btn { display: inline-block; margin-top: 1.25rem; padding: 0.85rem 1.4rem; background: #36873A; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 600; }
    .muted { color: #6b7280; font-size: 0.95rem; margin-top: 1rem; word-break: break-all; }
  </style>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var id = "";
      if (parts.length >= 2 && parts[0] === "san-pham") id = parts[1];
      else if (parts.length === 1) id = parts[0];
      if (!id) return;
      var deep = "healthup://product/" + encodeURIComponent(id);
      // Try open app immediately on mobile.
      setTimeout(function () { location.href = deep; }, 300);
      window.addEventListener("DOMContentLoaded", function () {
        var a = document.getElementById("openApp");
        if (a) a.href = deep;
        var m = document.getElementById("pid");
        if (m) m.textContent = id;
      });
    })();
  </script>
</head>
<body>
  <h1>HealthUp</h1>
  <p>Mở sản phẩm trong ứng dụng HealthUp trên điện thoại.</p>
  <a class="btn" id="openApp" href="#">Mở app</a>
  <p class="muted">Mã sản phẩm: <span id="pid"></span></p>
</body>
</html>
